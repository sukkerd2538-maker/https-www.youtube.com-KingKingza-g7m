
<div class="min-h-screen flex flex-col p-4 md:p-8">
  <header class="text-center mb-8">
    <h1 class="text-4xl md:text-5xl font-extrabold">
      <span class="text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-indigo-600">
        AI Creative Suite
      </span>
    </h1>
    <p class="mt-2 text-slate-400">Your personal AI-powered Chatbot and Image Generator</p>
  </header>

  <main class="flex-1 flex flex-col max-w-7xl w-full mx-auto">
    <!-- Tabs -->
    <div class="flex border-b border-slate-700 mb-6">
      <button
        (click)="setView('chat')"
        class="flex items-center gap-2 px-6 py-3 font-medium text-lg border-b-2 transition-colors duration-200"
        [class.text-indigo-400]="activeView() === 'chat'"
        [class.border-indigo-400]="activeView() === 'chat'"
        [class.text-slate-400]="activeView() !== 'chat'"
        [class.border-transparent]="activeView() !== 'chat'"
        [class.hover:text-indigo-300]="activeView() !== 'chat'">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-6 h-6">
            <path stroke-linecap="round" stroke-linejoin="round" d="M8.625 12a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Zm0 0H8.25m4.125 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Zm0 0H12m4.125 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Zm0 0h-.375M21 12c0 4.556-3.04 8.25-7.125 8.25a8.25 8.25 0 0 1-8.25-8.25c0-4.556 3.04-8.25 7.125-8.25a8.25 8.25 0 0 1 8.25 8.25Z" />
          </svg>
        <span>Chatbot</span>
      </button>
      <button
        (click)="setView('image')"
        class="flex items-center gap-2 px-6 py-3 font-medium text-lg border-b-2 transition-colors duration-200"
        [class.text-indigo-400]="activeView() === 'image'"
        [class.border-indigo-400]="activeView() === 'image'"
        [class.text-slate-400]="activeView() !== 'image'"
        [class.border-transparent]="activeView() !== 'image'"
        [class.hover:text-indigo-300]="activeView() !== 'image'">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-6 h-6">
            <path stroke-linecap="round" stroke-linejoin="round" d="m2.25 15.75 5.159-5.159a2.25 2.25 0 0 1 3.182 0l5.159 5.159m-1.5-1.5 1.409-1.409a2.25 2.25 0 0 1 3.182 0l2.909 2.909m-18 3.75h16.5a1.5 1.5 0 0 0 1.5-1.5V6a1.5 1.5 0 0 0-1.5-1.5H3.75A1.5 1.5 0 0 0 2.25 6v12a1.5 1.5 0 0 0 1.5 1.5Zm10.5-11.25h.008v.008h-.008V8.25Zm.375 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Z" />
          </svg>
        <span>Image Generator</span>
      </button>
    </div>

    <!-- Content Area -->
    <div class="flex-1 min-h-0">
      @if (activeView() === 'chat') {
        <app-chatbot class="h-full block"></app-chatbot>
      } @else {
        <app-image-generator class="h-full block"></app-image-generator>
      }
    </div>
  </main>
</div>
